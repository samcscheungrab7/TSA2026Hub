<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Suggest a New Community Resource</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3efe9, #e6dccf);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 120px; /* space below navbar */
        }

        /* NAVBAR */
        .navbar {
            background-color: #6f4528;
            position: fixed;
            top: 0;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .navbar a {
            float: left;
            color: #ffffff;
            text-align: center;
            padding: 22px 26px;
            font-size: 18px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #8b5e3c;
        }

        /* MAIN CONTAINER */
        .container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 90%;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 15px;
            color: #3b2f2f;
        }

        h4 {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #5a4a42;
            font-weight: normal;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        input, select, textarea {
            font-family: "Georgia", serif;
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            font-family: "Georgia", serif;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5e3c, #6f4528);
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(139, 94, 60, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 94, 60, 0.5);
            background: linear-gradient(135deg, #9c6a44, #7b4b2b);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="index.html">Home</a>
    </div>

    <div class="container">
        <h1>Suggest a New Community Resource</h1>
        <h4>*Submit the form below and we will get back to you about your idea*</h4>

        <form action="https://formspree.io/f/xnnegaqd" method="POST">
            <label for="resource-name">Resource Name:</label>
            <input type="text" id="resource-name" name="resource-name" required>

            <label for="resource-type">Resource Type:</label>
            <select id="resource-type" name="resource-type" required>
                <option value="">--- Choose a Type ---</option>
                <option>Grantmaking Organizations</option>
                <option>Food Services</option>
                <option>Human Services / Community Support</option>
                <option>Youth Support</option>
                <option>Housing Support</option>
                <option>Mental Health Support</option>
                <option>History</option>
                <option>Environmental Projects</option>
                <option>Other</option>
            </select>

            <label for="resource-description">Description of Resource:</label>
            <textarea id="resource-description" name="resource-description" rows="4" required></textarea>

            <label for="resource-contact">Your Contact Information (Email or Phone Number):</label>
            <input type="text" id="resource-contact" name="resource-contact" required>

            <button type="submit">Submit Resource</button>
        </form>
    </div>

</body>
</html>

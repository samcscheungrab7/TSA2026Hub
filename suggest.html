    <div class="navbar">
        <a href="index.html">Home</a>

<br><br><br><br>


<font size=+6 class="shadow-heading"><b><center>Suggest a New Community Resource</center></font></b>
	<br><br>
<style>

.shadow-heading {
  font-size: 48px;
  color: #000000;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
}
</style>





 <section class="submit-resource">
<h4><center>*Submit the form below and we will get back to you about your idea*</center></h4><br>
  <form action="https://formspree.io/f/xnnegaqd" method="POST">
    <h3>
    <label for="resource-name">Resource Name:</label>
    <input type="text" id="resource-name" name="resource-name" required>
<br><br>
    <label for="resource-type">Resource Type:</label>
    <select id="resource-type" name="resource-type" required><br><br>
      <option value="">--- Choose a Type ---</option>
      <option value="food">Grantmaking Organizations</option>
      <option value="shelter">Food Services</option>
      <option value="health">Human Services/ Community Support</option>
      <option value="education">Youth Support</option>
      <option value="jobs">Housing Support</option>
      <option value="other">Mental Health Support</option>
    <option value="other">History</option>
	    <option value="other">Environmental Projects</option>
    <option value="other">Other</option>

	</select>
<br><br>
    <label for="resource-description">Description of Resource:</label>
    <textarea id="resource-description" name="resource-description" rows="4" required></textarea>
<br><br>
    <label for="resource-contact">Your Contact Information (Email or Phone Number):</label>
    <input type="text" id="resource-contact" name="resource-contact" required>
<br><br>
    <button type="submit">Submit Resource</button>
  </form>
</section></h3>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Important Forms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3efe9, #e6dccf);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 90%;
            margin: 60px 0 40px 0; /* heading moved up */
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 35px; /* slightly less space below */
            color: #3b2f2f;
        }

        #resourceList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            justify-items: center;
        }

        /* For the single card below */
        #resourceList .single-card {
            grid-column: 1 / -1; /* spans full width */
            max-width: 50%;
        }

        .resource-card {
            background: linear-gradient(135deg, #8b5e3c, #6f4528);
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 6px 15px rgba(139,94,60,0.4);
            text-align: center;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            color: #fff;
            cursor: pointer;
        }

        .resource-card h3 {
            margin: 0;
            font-size: 1.4rem;
        }

        /* Make entire card clickable */
        .resource-card a {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-indent: -9999px; /* hide link text */
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(139,94,60,0.5);
            background: linear-gradient(135deg, #9c6a44, #7b4b2b);
        }

        @media (max-width: 600px) {
            #resourceList {
                grid-template-columns: 1fr;
            }
            #resourceList .single-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Important Forms</h1>
        <div id="resourceList">
            <div class="resource-card">
                <h3>Plan of Work Log</h3>
                <a href="https://docs.google.com/document/d/1xf6N2sAGqyjwxsawLiMpT6-5Axd9HOOKXN4N3jGpwfM/edit?usp=sharing" target="_blank"></a>
            </div>

            <div class="resource-card">
                <h3>Student Copyright Checklist</h3>
                <a href="https://docs.google.com/document/d/1Z7qJpmRQqDxFQFEElyBicosZ1BLDpHA4r6_4Yl2wkQ4/edit?usp=sharing" target="_blank"></a>
            </div>

            <div class="resource-card single-card">
                <h3>Reference Page</h3>
                <a href="https://docs.google.com/document/d/10tA-fsyTwUpHWl57mVf1uv9wMSTWOvHd-AkzlXWayik/edit?usp=sharing" target="_blank"></a>
            </div>
        </div>
    </div>
</body>
</html>

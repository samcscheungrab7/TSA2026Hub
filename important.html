<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Important Forms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3efe9, #e6dccf);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 90%;
            margin: 80px 0 40px 0;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 30px;
            color: #3b2f2f;
        }

        #resourceList {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .resource-card {
            background: linear-gradient(135deg, #8b5e3c, #6f4528);
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 6px 15px rgba(139,94,60,0.4);
            text-align: center;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            color: #fff;
        }

        .resource-card h3 {
            margin-bottom: 12px;
        }

        .resource-card a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 8px;
            transition: text-decoration 0.2s ease;
        }

        .resource-card a:hover {
            text-decoration: underline;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(139,94,60,0.5);
            background: linear-gradient(135deg, #9c6a44, #7b4b2b);
        }

        @media (max-width: 600px) {
            .container {
                padding: 50px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Important Forms</h1>
        <div id="resourceList">
            <div class="resource-card">
                <h3>Plan of Work Log</h3>
                <a href="https://docs.google.com/document/d/1xf6N2sAGqyjwxsawLiMpT6-5Axd9HOOKXN4N3jGpwfM/edit?usp=sharing" target="_blank">Open Form</a>
            </div>

            <div class="resource-card">
                <h3>Student Copyright Checklist</h3>
                <a href="https://docs.google.com/document/d/1Z7qJpmRQqDxFQFEElyBicosZ1BLDpHA4r6_4Yl2wkQ4/edit?usp=sharing" target="_blank">Open Form</a>
            </div>

            <div class="resource-card">
                <h3>Reference Page</h3>
                <a href="https://docs.google.com/document/d/10tA-fsyTwUpHWl57mVf1uv9wMSTWOvHd-AkzlXWayik/edit?usp=sharing" target="_blank">Open Form</a>
            </div>
        </div>
    </div>
</body>
</html>

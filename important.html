<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Important Forms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3efe9, #e6dccf);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 120px; /* space under navbar */
        }

        /* NAVBAR */
        .navbar {
            background-color: #6f4528;
            position: fixed;
            top: 0;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .navbar a {
            float: left;
            color: #ffffff;
            text-align: center;
            padding: 22px 26px;
            font-size: 18px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #8b5e3c;
        }

        /* MAIN CONTAINER */
        .container {
            text-align: center;
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 90%;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 40px;
            color: #3b2f2f;
        }

        /* BUTTON GRID */
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .resource-card {
            font-family: "Georgia", serif;
            box-sizing: border-box;
            position: relative;
            width: 100%;
            padding: 26px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5e3c, #6f4528);
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(139, 94, 60, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-align: center;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(139, 94, 60, 0.5);
            background: linear-gradient(135deg, #9c6a44, #7b4b2b);
        }

        /* Center third card */
        .resource-card.single {
            grid-column: 1 / -1;
            justify-self: center;
            max-width: 60%;
        }

        /* Make entire card clickable */
        .resource-card a {
            position: absolute;
            inset: 0;
            text-indent: -9999px;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }

            .resource-card.single {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="index.html">Home</a>
    </div>

    <div class="container">
        <h1>Important Forms</h1>

        <div class="button-group">
            <div class="resource-card">
                Plan of Work Log
             <a href="Plan of work log for Webmaster_.pdf" target="_blank"></a>
            </div>

            <div class="resource-card">
                Student Copyright Checklist
                <a href="https://docs.google.com/document/d/1Z7qJpmRQqDxFQFEElyBicosZ1BLDpHA4r6_4Yl2wkQ4/edit?usp=sharing" target="_blank"></a>
            </div>

            <div class="resource-card single">
                Reference Page
                <a href="https://docs.google.com/document/d/10tA-fsyTwUpHWl57mVf1uv9wMSTWOvHd-AkzlXWayik/edit?usp=sharing" target="_blank"></a>
            </div>
        </div>
    </div>

</body>
</html>

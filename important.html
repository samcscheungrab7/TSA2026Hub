<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Important Forms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3efe9, #e6dccf);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 90%;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 45px;
            color: #3b2f2f;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            justify-items: center;
        }

        /* Center the third box */
        .button-group .single {
            grid-column: 1 / -1;
            width: 60%;
        }

        .resource-card {
            position: relative;
            width: 100%;
            padding: 26px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5e3c, #6f4528);
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(139, 94, 60, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(139, 94, 60, 0.5);
            background: linear-gradient(135deg, #9c6a44, #7b4b2b);
        }

        /* Make entire card clickable */
        .resource-card a {
            position: absolute;
            inset: 0;
            text-indent: -9999px;
        }

        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }

            .button-group .single {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Important Forms</h1>

        <div class="button-group">
            <div class="resource-card">
                Plan of Work Log
                <a href="https://docs.google.com/document/d/1xf6N2sAGqyjwxsawLiMpT6-5Axd9HOOKXN4N3jGpwfM/edit?usp=sharing" target="_blank"></a>
            </div>

            <div class="resource-card">
                Student Copyright Checklist
                <a href="https://docs.google.com/document/d/1Z7qJpmRQqDxFQFEElyBicosZ1BLDpHA4r6_4Yl2wkQ4/edit?usp=sharing" target="_blank"></a>
            </div>

            <div class="resource-card single">
                Reference Page
                <a href="https://docs.google.com/document/d/10tA-fsyTwUpHWl57mVf1uv9wMSTWOvHd-AkzlXWayik/edit?usp=sharing" target="_blank"></a>
            </div>
        </div>
    </div>
</body>
</html>
